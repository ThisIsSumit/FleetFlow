# Development stack. Ports are bound to 127.0.0.1 only: these services use dev passwords and Redis has no auth.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro   # creates the non-superuser app role (needed for row-level security)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]   # web UI on 8025, SMTP on 1025
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on: [kafka]
    ports: ["127.0.0.1:8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment: {REDIS_ADDR: 'redis://redis:6379'}
    depends_on: [redis]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ['./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3000:3000']
  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      mailpit: {condition: service_started}
      redis: {condition: service_started}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: fleetflow_app                 # non-superuser: row-level security applies
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_ADMIN_USER: ${POSTGRES_USER}        # Flyway migrations only
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      EVENTS_PUBLISHER: kafka
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEV_TOOLS: ${DEV_TOOLS:-false}
      RATE_LIMIT_ORDERS: ${RATE_LIMIT_ORDERS:-100}
      APP_URL: ${APP_URL:-http://localhost:5173}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-FleetFlow <no-reply@fleetflow.dev>}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-FleetFlow/0.1 (set GEOCODER_USER_AGENT with a contact address)}
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata:
